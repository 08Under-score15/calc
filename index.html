<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div id="calculator">

        <input readonly id="calculator-input" type="text">

        <div id="button-container">
            <button class="grey">C</button>
            <button class="grey">DEL</button>
            <button class="grey">%</button>
            <button class="grey">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="orange">*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="orange">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="orange">+</button>

            <button class="width-2">0</button>
            <button>.</button>
            <button class="orange">=</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
